{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Витрина{% endblock %}</title>
    <!-- Локальные файлы, которые гарантированно загрузятся без интернета -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <!-- Добавляем локальное чтение иконок, которые вы только что сохранили -->
    <link href="{% static 'css/bootstrap-icons.min.css' %}" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'shop:product_list' %}">Магазин "Витрина"</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3 text-white">Привет, <strong>{{ user.username }}</strong>!</span>
                    <a class="btn btn-outline-danger btn-sm px-3" href="{% url 'shop:logout' %}">Выйти</a>
                {% else %}
                    <a class="nav-link text-white me-2" href="{% url 'shop:login' %}">Войти</a>
                    <a class="btn btn-primary btn-sm px-3" href="{% url 'shop:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

        <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
